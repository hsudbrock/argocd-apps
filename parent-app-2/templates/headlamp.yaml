apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-app
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/resources-finalizer
spec:
  project: default
  source:
    repoURL: 'https://kubernetes-sigs.github.io/headlamp/'
    targetRevision: 0.39.0
    chart: headlamp
    helm:
      values: |
        service:
          annotations:
            tailscale.com/expose: "true"
            tailscale.com/hostname: headlamp
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
