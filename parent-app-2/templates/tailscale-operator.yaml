apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://pkgs.tailscale.com/helmcharts"
    targetRevision: v1.92.4
    chart: tailscale-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
